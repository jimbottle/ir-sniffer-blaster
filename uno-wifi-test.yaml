# SPIKE (branch esp8266-uno-wifi-spike): can the UNO+WiFi R3's ESP8266 half do
# this project's job? Tracks ir-sniffer-blaster-exg.
#
# The board is a UNO+WiFi R3 ATmega328P+ESP8266 CH340: two independent MCUs
# sharing a PCB, joined only by serial through the DIP-switch bank. This config
# targets the ESP8266 ONLY; the ATmega is dead weight and its switches (1-4)
# stay OFF so it cannot sit on the serial lines.
#
# Like ir-wiring-test.yaml, this is deliberately network-free: no wifi / api /
# ota / web_server, so it needs no secrets.yaml and cannot touch the production
# living-room device. Everything reports over the USB serial console.
#
# ── DIP switches ──────────────────────────────────────────────────────────────
#   Flash:  5,6,7 ON, rest OFF   (CH340 -> ESP8266, switch 7 holds GPIO0 low)
#   Logs:   5,6   ON, rest OFF   (CH340 -> ESP8266 serial console)
#
# ── Wiring (5990 transceiver) ─────────────────────────────────────────────────
#   red   (VIN)        -> 3.3V   (MANDATORY here, not just prudent: ESP8266 has
#                                 no 5V-tolerant pins at all)
#   black (GND)        -> GND
#   white (IRin,  RX)  -> GPIO5  (see pin-choice note below)
#   green (IRout, TX)  -> GPIO4
#
#   ⚠️ Many of these boards silkscreen GPIO4 and GPIO5 SWAPPED. If the RX test
#   below stays silent when you press the remote, swap the white and green
#   wires before debugging anything else.
#
# ── Why GPIO4/GPIO5 ──────────────────────────────────────────────────────────
# They are the ESP8266's only two pins with no boot-strap role and full
# interrupt support. Every alternative fails somehow: GPIO0/GPIO2 must be HIGH
# at reset and GPIO15 LOW (the 5990's receiver output is active-low, so IR
# arriving during power-up could hold a strap pin wrong and brick the boot),
# and GPIO16 has no interrupts, which the receiver needs.
#
# ── The test: two legs, verified independently ───────────────────────────────
# ⚠️ On-device self-hearing loopback is ARCHITECTURALLY IMPOSSIBLE on ESP8266,
# so a silent log after a TX line is EXPECTED and proves nothing about wiring.
# On chips without the RMT peripheral, ESPHome's transmitter bit-bangs each
# frame holding an InterruptLock — interrupts globally disabled for the frame's
# whole lifetime (remote_transmitter.cpp:86-103 in esphome==2026.6.2) — while
# the ESP8266 receiver captures edges in a GPIO ISR (remote_receiver.cpp:74).
# Every edge of our own transmission arrives while that ISR is masked. The
# Feather's proven self-hearing (ir-blaster-livingroom.yaml:119-122) does NOT
# transfer: ESP32 RMT hardware captures independently of CPU interrupt state.
#
# RX leg (this board alone): point the real fan remote at the 5990 and press.
#   PASS = "Received Symphony: data=0xD81, nbits=12" in the log. Receiving
#   actuates nothing, so using the real remote is safe.
#
# TX leg (needs an independent witness): this config transmits Symphony
#   data=0x5A5 nbits=12 every 15 s as a beacon. Point the 5990 at a SECOND
#   receiver — the Feather running ir-wiring-test.yaml, or the production
#   living-room device (its dump: all logs over the API).
#   PASS = the witness logs Symphony 0x5A5 every 15 s.
#
# 0x5A5 is deliberately NOT the living-room fan's code (0xD81): even fired
# within range of the real fan, the beacon actuates nothing.
#
# ── What a two-leg PASS does and does not prove ──────────────────────────────
# Proves: toolchain flashes this board; both 5990 directions work on ESP8266
# bit-banged IR. Does NOT prove equivalence with the Feather's RMT-hardware
# timing under WiFi load — that needs an R1-style gate with wifi enabled before
# this board is trusted for the real role.

esphome:
  name: uno-wifi-test
  platformio_options:
    # Same CH34x bridge family as the Feather; hold the proven 115200 rather
    # than rediscover the "chip stopped responding" failure. See docs/hardware.md.
    upload_speed: 115200

esp8266:
  board: esp12e         # ESP-8266EX + 4MB flash, matches the on-board module
  framework:
    version: recommended

logger:
  level: DEBUG          # raw/decoded IR dumps appear here

# IR RECEIVE — 5990 white wire (IRin, receiver output) -> GPIO5.
# Settings mirrored from ir-blaster-livingroom.yaml where they are portable.
# receive_symbols is NOT here on purpose: it is an ESP32 RMT-peripheral option
# and does not exist on ESP8266. buffer_size is the only sizing knob on this
# platform (raw-edge ring buffer; ESP8266 default is 1kb — kept modest because
# this chip has ~50KB of usable heap, and a Symphony frame is tiny).
remote_receiver:
  pin:
    number: GPIO5
    inverted: true      # 5990 output idles HIGH, active LOW — same polarity R1
                        # corrected on the Feather (mirrored, not re-derived)
  dump: all             # log decoded protocol+code AND raw timings
  tolerance: 25%
  idle: 25ms
  buffer_size: 2kb

# IR TRANSMIT — 5990 green wire (IRout, emitter drive) -> GPIO4.
# On ESP8266 the 38kHz carrier is bit-banged (no RMT peripheral) — that timing
# fidelity question is exactly what the loopback observes.
remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

# TX beacon for the witness receiver (see "The test" above). This device
# CANNOT hear its own transmission — transmit runs under an InterruptLock that
# masks the receiver's ISR — so no RX dump follows this line in OUR log; the
# beacon only exists to be caught by a second receiver. command_repeats left at
# its default (2) to match what the real remote does.
interval:
  - interval: 15s
    then:
      - logger.log:
          level: INFO
          format: "TX beacon: Symphony data=0x5A5 nbits=12 (verify on a SECOND receiver; this device cannot hear itself)"
      - remote_transmitter.transmit_symphony:
          data: 0x5A5
          nbits: 12
