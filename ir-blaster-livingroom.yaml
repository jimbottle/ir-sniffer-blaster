esphome:
  name: ir-blaster-livingroom
  friendly_name: IR Blaster (Living Room)

esp32:
  board: featheresp32-v2
  framework:
    type: arduino

logger:
  level: DEBUG          # raw/decoded IR dumps appear here during capture

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:            # static IP for a permanent fixture; adjust to the LAN
    static_ip: 192.168.0.150
    gateway: 192.168.0.1
    subnet: 255.255.255.0

api:
  encryption:
    key: !secret api_encryption_key
  # Generic programmatic transmit: call this HA service with a raw timing array
  # (microseconds, +mark / -space) to replay anything captured.
  services:
    - service: send_raw_ir
      variables:
        raw: int[]
      then:
        - remote_transmitter.transmit_raw:
            code: !lambda 'return raw;'
            carrier_frequency: 38000

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80              # manual control + status at http://<ip>/

# IR RECEIVE (sniff + capture) — green wire -> GPIO14
remote_receiver:
  pin:
    number: GPIO14
    inverted: false     # 5990 output is buffered/demodulated; do NOT invert
  dump: all             # logs decoded protocol+code AND raw timings
  tolerance: 25%
  idle: 25ms
  buffer_size: 2kb

# IR TRANSMIT (replay / spoof) — white wire -> GPIO27
remote_transmitter:
  pin: GPIO27
  carrier_duty_percent: 50%

# Example replay buttons — replace with real captured values.
button:
  - platform: template
    name: "TV Power"
    on_press:
      - remote_transmitter.transmit_nec:    # use the protocol the log reports
          address: 0x20DF
          command: 0x10EF

  - platform: template
    name: "TV Volume Up (raw example)"
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: [9000, -4500, 560, -560, 560, -1690, 560, -560]   # truncated sample
