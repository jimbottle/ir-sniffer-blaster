esphome:
  name: ir-blaster-livingroom
  # DO NOT RENAME. The device physically moved to the BEDROOM on 2026-08-10 and
  # Home Assistant was updated there (area `bedroom`, name_by_user "IR Blaster
  # (Bedroom)"), which overrides this string everywhere in the UI. This name, the
  # `name:` above, this file's name and the generated entity ids were ALL kept
  # deliberately. Renaming any of them breaks things that are not in this repo:
  #   - `button.ir_blaster_living_room_fan_power` is fired by an automation in
  #     jimbottle/home-assistant-pi (automations/bangle_irblast.yaml), which is
  #     what the Bangle.js watch button triggers
  #   - changing `name:` forces re-adoption in HA and changes the generated
  #     service id `esphome.ir_blaster_livingroom_send_raw_ir`
  # The location lives in HA's registry, not in firmware. See docs/naming.md.
  friendly_name: IR Blaster (Living Room)
  platformio_options:
    # This board's USB-serial bridge is a CH34x (VID 0x1A86), which is unreliable at
    # the 921600 upload speed the ESP32 board definition defaults to — the flash
    # connects, IDs the chip, then dies with "chip stopped responding". 115200 works.
    # (Not an esptool default; esptool's own default is 115200. The 921600 comes from
    # the Arduino/PlatformIO board manifest.)
    upload_speed: 115200

esp32:
  board: adafruit_feather_esp32_v2   # ESPHome key for the Adafruit Feather ESP32 V2 (variant esp32)
  framework:
    type: arduino

logger:
  level: DEBUG          # raw/decoded IR dumps appear here during capture

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Using DHCP (reserve the address on your router). Reachable via mDNS at
  # ir-blaster-livingroom.local. To pin a static IP in firmware instead, uncomment
  # and set to your LAN:
  # manual_ip:
  #   static_ip: 192.168.0.150
  #   gateway: 192.168.0.1
  #   subnet: 255.255.255.0
  # Recovery fallback: if the WiFi join fails (wrong creds, wrong band, out of
  # range), the board hosts its own AP so it stays reachable for reconfig without
  # dragging out a USB cable.
  ap:
    ssid: "IR-Blaster Fallback"
    password: !secret ap_password

# Serves a WiFi-setup page while the fallback AP is active.
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  # Generic programmatic transmit: call this HA action with a raw timing array
  # (microseconds, +mark / -space) to replay anything captured.
  # NOTE: current ESPHome uses `actions:`/`action:`. Older installs (pre-rename)
  # used `services:`/`service:` — swap back if your ESPHome errors on `actions`.
  # The generated HA service id is unchanged: esphome.ir_blaster_livingroom_send_raw_ir
  actions:
    - action: send_raw_ir
      variables:
        raw: int[]
      then:
        - remote_transmitter.transmit_raw:
            code: !lambda 'return raw;'
            carrier_frequency: 38000

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80              # manual control + status at http://<ip>/

# IR RECEIVE (sniff + capture) — 5990 white wire (IRin, receiver output) -> GPIO14
remote_receiver:
  pin:
    number: GPIO14
    # ⚠️ CORRECTED 2026-08-09 (R1). This was `false` since bring-up on the strength of a
    # claim nobody had ever tested — the ESPHome receiver dump had never once been
    # observed. R1 observed it, and `false` is wrong for this hardware.
    #
    # R1 run 1 (inverted: false): the capture came back as the known-good fan code with
    # EVERY SIGN FLIPPED — 24/24 leading entries inverted, magnitudes matching to 15.5us
    # mean. Not an alignment artefact; those offset magnitudes by a position and these
    # did not. Replaying it did not actuate the fan.
    # R1 run 2 (inverted: true): capture replayed through transmit_raw ACTUATED THE FAN.
    #
    # The 5990's IRin idles HIGH and pulls LOW during a carrier burst, so `false` records
    # idle as mark. README.md and docs/troubleshooting.md both asserted the opposite in
    # bold; both are corrected as of this change.
    inverted: true
  dump: all             # logs decoded protocol+code AND raw timings
  tolerance: 25%
  idle: 25ms
  # FRAME LENGTH IS receive_symbols, NOT buffer_size. An earlier revision of this file
  # raised buffer_size 2kb -> 8kb and claimed it fixed silent truncation; it did not.
  # buffer_size only floors a queue of completed events awaiting the main loop
  # (remote_receiver_rmt.cpp:107), and its esp32 default is already 10000b
  # (__init__.py:112) — so 8kb was still below stock. The per-frame ceiling is
  # receive_symbols, passed as the rmt_receive length (remote_receiver_rmt.cpp:109).
  # Default 192, times 2 pulses per symbol, tops out near 384 entries.
  receive_symbols: 256  # ~512 entries; covers the 450-entry HVAC frames R11 is sampling for
  buffer_size: 10000b   # esp32 default, stated so it is not silently reduced again.
                        # Event-queue depth, NOT capture length.
  # MIRRORED in ir-wiring-test.yaml and ir-roundtrip-test.yaml — change all three.

# IR TRANSMIT (replay / spoof) — 5990 green wire (IRout, emitter drive) -> GPIO27
remote_transmitter:
  pin: GPIO27
  carrier_duty_percent: 50%

# Replay buttons — each fires a captured raw code out the emitter (GPIO27).
# Capture new codes with arduino-tests/ir_rx_decode_test (see docs/capture-replay.md
# and captured-codes/), convert IRremote mark/space to ESPHome signed (+mark/-space),
# and add a button here.
#
# ⚠️ CORRECTED 2026-08-09: this comment used to read "This remote decodes as UNKNOWN
# protocol, so we use raw." It does NOT. That was an artefact of inverted RX polarity.
# With `inverted: true` it decodes as Symphony data=0xD81 nbits=12, and ESPHome has a
# matching `remote_transmitter.transmit_symphony` action taking data/nbits/
# command_repeats. The raw array below still works and is left in place as the proven
# path, but PREFER THE DECODED FORM for new codes — it is ~3 fields instead of a
# 120-entry array. See captured-codes/README.md.
button:
  # ── PHASE 2 PROBE: does the DECODED form actuate the fan? ─────────────────────
  # Added 2026-08-09. R1 proved the raw path; this tests whether the compact decoded
  # form is equivalent IN TRANSMIT, which is what the code library's schema hinges on.
  #
  # Evidence it should work: with inverted: true the fan remote decodes as Symphony
  # data=0xD81 nbits=12, AND the device hearing its own transmission of the 47-entry raw
  # array below decodes it as the SAME Symphony 0xD81/12 (observed 13:13:17 and
  # 13:13:21 on 2026-08-09). So raw and decoded are the same signal on the RX side.
  # This button tests the TX side.
  #
  # If this toggles the fan, the library becomes protocol-first: ~3 fields per code
  # instead of a 120-entry array, roughly 50x smaller, which lands directly on the
  # watch's response-size limit (R2). If it does NOT, the library stays raw-only and
  # that is a much bigger payload problem to design around.
  #
  # command_repeats defaults to 2 and is left at the default deliberately — that is what
  # the real remote does, and it is why one press captures ~2.5 frames.
  - platform: template
    name: "Fan Power (Symphony probe)"
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xD81
          nbits: 12

  - platform: template
    name: "Fan Power"                 # captured this session: hash 0xDA0AE878, verified toggling the fan
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: [1280, -420, 1230, -420, 430, -1270, 1230, -420, 1230, -420, 380, -1270, 380, -1270, 430, -1220, 430, -1270, 380, -1270, 380, -1270, 1230, -7120, 1230, -420, 1230, -420, 430, -1270, 1230, -420, 1230, -420, 380, -1270, 380, -1270, 430, -1220, 430, -1270, 380, -1270, 380, -1270, 1230]
