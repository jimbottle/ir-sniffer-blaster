esphome:
  name: ir-blaster-livingroom
  friendly_name: IR Blaster (Living Room)

esp32:
  board: featheresp32-v2
  framework:
    type: arduino

logger:
  level: DEBUG          # raw/decoded IR dumps appear here during capture

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:            # static IP for a permanent fixture; adjust to the LAN
    static_ip: 192.168.0.150
    gateway: 192.168.0.1
    subnet: 255.255.255.0
  # Recovery fallback: if the WiFi join fails (wrong creds, or the static IP
  # above collides on the LAN), the board hosts its own AP so it stays
  # reachable for reconfig without dragging out a USB cable.
  ap:
    ssid: "IR-Blaster Fallback"
    password: !secret ap_password

# Serves a WiFi-setup page while the fallback AP is active.
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  # Generic programmatic transmit: call this HA action with a raw timing array
  # (microseconds, +mark / -space) to replay anything captured.
  # NOTE: current ESPHome uses `actions:`/`action:`. Older installs (pre-rename)
  # used `services:`/`service:` — swap back if your ESPHome errors on `actions`.
  # The generated HA service id is unchanged: esphome.ir_blaster_livingroom_send_raw_ir
  actions:
    - action: send_raw_ir
      variables:
        raw: int[]
      then:
        - remote_transmitter.transmit_raw:
            code: !lambda 'return raw;'
            carrier_frequency: 38000

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80              # manual control + status at http://<ip>/

# IR RECEIVE (sniff + capture) — green wire -> GPIO14
remote_receiver:
  pin:
    number: GPIO14
    inverted: false     # 5990 output is buffered/demodulated; do NOT invert
  dump: all             # logs decoded protocol+code AND raw timings
  tolerance: 25%
  idle: 25ms
  buffer_size: 2kb

# IR TRANSMIT (replay / spoof) — white wire -> GPIO27
remote_transmitter:
  pin: GPIO27
  carrier_duty_percent: 50%

