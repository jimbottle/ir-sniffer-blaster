esphome:
  name: ir-blaster-livingroom
  # DO NOT RENAME. The device physically moved to the BEDROOM on 2026-08-10 and
  # Home Assistant was updated there (area `bedroom`, name_by_user "IR Blaster
  # (Bedroom)"), which overrides this string everywhere in the UI. This name, the
  # `name:` above, this file's name and the generated entity ids were ALL kept
  # deliberately. Renaming any of them breaks things that are not in this repo:
  #   - `button.ir_blaster_living_room_fan_power` is fired by an automation in
  #     jimbottle/home-assistant-pi (automations/bangle_irblast.yaml), which is
  #     what the Bangle.js watch button triggers
  #   - changing `name:` forces re-adoption in HA and changes the generated
  #     service id `esphome.ir_blaster_livingroom_send_raw_ir`
  # The location lives in HA's registry, not in firmware. See docs/naming.md.
  friendly_name: IR Blaster (Living Room)
  platformio_options:
    # This board's USB-serial bridge is a CH34x (VID 0x1A86), which is unreliable at
    # the 921600 upload speed the ESP32 board definition defaults to — the flash
    # connects, IDs the chip, then dies with "chip stopped responding". 115200 works.
    # (Not an esptool default; esptool's own default is 115200. The 921600 comes from
    # the Arduino/PlatformIO board manifest.)
    upload_speed: 115200

esp32:
  board: adafruit_feather_esp32_v2   # ESPHome key for the Adafruit Feather ESP32 V2 (variant esp32)
  framework:
    type: arduino

logger:
  level: DEBUG          # raw/decoded IR dumps appear here during capture

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # DHCP, and as of 2026-09-02 the router holds a RESERVATION: MAC 14:33:5C:98:DA:A4
  # -> 192.168.0.3. That closes the long-standing ask in home-assistant-pi-6sf, filed
  # because the address really did drift (192.168.0.6 through 2026-08-09, 192.168.0.3
  # by 2026-09-01).
  # Still prefer mDNS (ir-blaster-livingroom.local) in scripts and runbooks: it is what
  # `esphome logs` resolves by default, it is the handle that survived the drift, and a
  # reservation lives in router config that this repo does not version. To pin a
  # static IP in firmware instead, uncomment and set to your LAN:
  # manual_ip:
  #   static_ip: 192.168.0.150
  #   gateway: 192.168.0.1
  #   subnet: 255.255.255.0
  # Recovery fallback: if the WiFi join fails (wrong creds, wrong band, out of
  # range), the board hosts its own AP so it stays reachable for reconfig without
  # dragging out a USB cable.
  ap:
    ssid: "IR-Blaster Fallback"
    password: !secret ap_password

# Serves a WiFi-setup page while the fallback AP is active.
captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  # Generic programmatic transmit: call this HA action with a raw timing array
  # (microseconds, +mark / -space) to replay anything captured.
  # NOTE: current ESPHome uses `actions:`/`action:`. Older installs (pre-rename)
  # used `services:`/`service:` — swap back if your ESPHome errors on `actions`.
  # The generated HA service id is unchanged: esphome.ir_blaster_livingroom_send_raw_ir
  actions:
    - action: send_raw_ir
      variables:
        raw: int[]
      then:
        - remote_transmitter.transmit_raw:
            code: !lambda 'return raw;'
            carrier_frequency: 38000

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80              # manual control + status at http://<ip>/

# IR RECEIVE (sniff + capture) — 5990 white wire (IRin, receiver output) -> GPIO14
remote_receiver:
  pin:
    number: GPIO14
    # ⚠️ CORRECTED 2026-08-09 (R1). This was `false` since bring-up on the strength of a
    # claim nobody had ever tested — the ESPHome receiver dump had never once been
    # observed. R1 observed it, and `false` is wrong for this hardware.
    #
    # R1 run 1 (inverted: false): the capture came back as the known-good fan code with
    # EVERY SIGN FLIPPED — 24/24 leading entries inverted, magnitudes matching to 15.5us
    # mean. Not an alignment artefact; those offset magnitudes by a position and these
    # did not. Replaying it did not actuate the fan.
    # R1 run 2 (inverted: true): capture replayed through transmit_raw ACTUATED THE FAN.
    #
    # The 5990's IRin idles HIGH and pulls LOW during a carrier burst, so `false` records
    # idle as mark. README.md and docs/troubleshooting.md both asserted the opposite in
    # bold; both are corrected as of this change.
    inverted: true
  dump: all             # logs decoded protocol+code AND raw timings
  tolerance: 25%
  idle: 25ms
  # FRAME LENGTH IS receive_symbols, NOT buffer_size. An earlier revision of this file
  # raised buffer_size 2kb -> 8kb and claimed it fixed silent truncation; it did not.
  # buffer_size only floors a queue of completed events awaiting the main loop
  # (remote_receiver_rmt.cpp:107), and its esp32 default is already 10000b
  # (__init__.py:112) — so 8kb was still below stock. The per-frame ceiling is
  # receive_symbols, passed as the rmt_receive length (remote_receiver_rmt.cpp:109).
  # Default 192, times 2 pulses per symbol, tops out near 384 entries.
  receive_symbols: 256  # ~512 entries; covers the 450-entry HVAC frames R11 is sampling for
  buffer_size: 10000b   # esp32 default, stated so it is not silently reduced again.
                        # Event-queue depth, NOT capture length.
  # MIRRORED in ir-wiring-test.yaml and ir-roundtrip-test.yaml — change all three.

# IR TRANSMIT (replay / spoof) — 5990 green wire (IRout, emitter drive) -> GPIO27
remote_transmitter:
  pin: GPIO27
  carrier_duty_percent: 50%

# Replay buttons — each fires a captured raw code out the emitter (GPIO27).
# Capture new codes with arduino-tests/ir_rx_decode_test (see docs/capture-replay.md
# and captured-codes/), convert IRremote mark/space to ESPHome signed (+mark/-space),
# and add a button here.
#
# ⚠️ CORRECTED 2026-08-09: this comment used to read "This remote decodes as UNKNOWN
# protocol, so we use raw." It does NOT. That was an artefact of inverted RX polarity.
# With `inverted: true` it decodes as Symphony data=0xD81 nbits=12, and ESPHome has a
# matching `remote_transmitter.transmit_symphony` action taking data/nbits/
# command_repeats. The raw array below still works and is left in place as the proven
# path, but PREFER THE DECODED FORM for new codes — it is ~3 fields instead of a
# 120-entry array. See captured-codes/README.md.
button:
  # ── PHASE 2 PROBE: does the DECODED form actuate the fan? ─────────────────────
  # Added 2026-08-09. R1 proved the raw path; this tests whether the compact decoded
  # form is equivalent IN TRANSMIT, which is what the code library's schema hinges on.
  #
  # Evidence it should work: with inverted: true the fan remote decodes as Symphony
  # data=0xD81 nbits=12, AND the device hearing its own transmission of the 47-entry raw
  # array below decodes it as the SAME Symphony 0xD81/12 (observed 13:13:17 and
  # 13:13:21 on 2026-08-09). So raw and decoded are the same signal on the RX side.
  # This button tests the TX side.
  #
  # If this toggles the fan, the library becomes protocol-first: ~3 fields per code
  # instead of a 120-entry array, roughly 50x smaller, which lands directly on the
  # watch's response-size limit (R2). If it does NOT, the library stays raw-only and
  # that is a much bigger payload problem to design around.
  #
  # command_repeats defaults to 2 and is left at the default deliberately — that is what
  # the real remote does, and it is why one press captures ~2.5 frames.
  - platform: template
    name: "Fan Power (Symphony probe)"
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xD81
          nbits: 12

  - platform: template
    name: "Fan Power"                 # captured this session: hash 0xDA0AE878, verified toggling the fan
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: &fan_raw [1280, -420, 1230, -420, 430, -1270, 1230, -420, 1230, -420, 380, -1270, 380, -1270, 430, -1220, 430, -1270, 380, -1270, 380, -1270, 1230, -7120, 1230, -420, 1230, -420, 430, -1270, 1230, -420, 1230, -420, 380, -1270, 380, -1270, 430, -1220, 430, -1270, 380, -1270, 380, -1270, 1230]

  # ── FAN SPEED, captured 2026-09-02 (ir-sniffer-blaster-dud) ─────────────────
  # Same remote, same Symphony protocol, same session as a fresh Fan Power
  # capture that reproduced 0xD81 exactly. Neither code rolls: 5/5 presses each.
  # The remote has DISCRETE up and down, not one cycling speed button -- the two
  # codes differ, which a single cycling button could not produce.
  #
  # *** THE DIRECTION OF EACH CODE IS FROM WATCHING THE FAN, NOT FROM THE
  # *** REMOTE BUTTON THAT PRODUCED IT, AND THE TWO DISAGREED. ***
  # At capture time the owner pressed "increase" first, which produced 0xD92,
  # and "decrease" second, which produced 0xD82. Firing them back on 2026-09-02
  # did the OPPOSITE: 0xD92 x3 stepped the fan DOWN and 0xD82 x3 stepped it UP,
  # observed on the physical fan. The actuation is the evidence; a report of
  # which button was pressed is not. Do NOT "correct" this back to match the
  # capture note -- that mapping is the one that was measured wrong.
  # CONFIRMED 2026-09-02 by re-test after this rename, fan running and watched:
  # 3x "Fan Speed Down" gave 2 observable decreases (the 3rd hit the floor and
  # did nothing), then 3x "Fan Speed Up" gave 3 increases ending at maximum.
  # BOTH ENDS CLAMP -- neither code wraps around. That matters for the watch:
  # SPEED + at maximum does nothing, rather than dumping the fan to minimum.
  # INFERRED, not measured: ~4 speed levels, and the fan was at level 3 when the
  # test began. That is the arithmetic those two counts imply; nobody has read a
  # speed indicator, so do not treat the level count as established.
  #
  # THE ANCHORS ARE NAMED BY CODE, NOT BY DIRECTION, deliberately. An anchor
  # called &fan_up_raw is a second place for the direction to be recorded, and
  # therefore a second place for it to be wrong; &sym_d92_raw cannot lie.
  #
  # PRODUCTION USES RAW, deliberately, even though the decoded form is 3 fields.
  # transmit_symphony has never been shown to actuate this fan: the "Fan Power
  # (Symphony probe)" button below has sat unpressed since 2026-08-09 and
  # docs/hardware-gate-runbook.md still lists that probe as open. Raw is the
  # only TX form with a physical result behind it -- and as of 2026-09-02 these
  # two buttons are part of that result.
  #
  # The arrays were DERIVED from the Pronto dump in the same capture, not
  # hand-timed, and validated before being trusted: run against that session's
  # Fan Power capture the conversion reproduced the stored `&fan_raw` array on
  # 46/47 entries within 80us, the only outlier being the inter-frame gap
  # (-7205 vs -7120, 1.2% on a 7ms pause). Each array also decodes by
  # mark/space ratio back to the exact Symphony value the receiver reported.
  # Two frames each, matching `&fan_raw` and the remote's command_repeats: 2.
  - platform: template
    name: "Fan Speed Up"              # Symphony 0xD82 -- MEASURED to raise speed
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: &sym_d82_raw [1288, -447, 1236, -447, 394, -1288, 1236, -447, 1236, -447, 394, -1288, 394, -1288, 394, -1288, 394, -1288, 394, -1288, 1236, -447, 394, -8047, 1236, -447, 1236, -447, 394, -1288, 1236, -447, 1236, -447, 394, -1288, 394, -1288, 394, -1288, 394, -1288, 394, -1288, 1236, -447, 394]

  - platform: template
    name: "Fan Speed Down"            # Symphony 0xD92 -- MEASURED to lower speed
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code: &sym_d92_raw [1288, -447, 1236, -447, 394, -1288, 1236, -447, 1236, -447, 394, -1288, 394, -1288, 1236, -447, 394, -1288, 394, -1288, 1236, -447, 394, -8047, 1236, -447, 1236, -447, 394, -1288, 1236, -447, 1236, -447, 394, -1288, 394, -1288, 1236, -447, 394, -1288, 394, -1288, 1236, -447, 394]

  # Decoded-form probes. Press these AFTER confirming the raw buttons above move
  # the fan, so a difference isolates the TX form rather than the code. With
  # "Fan Power (Symphony probe)" they answer the open Symphony TX question on
  # any of three codes.
  - platform: template
    name: "Fan Speed Up (Symphony probe)"
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xD82
          nbits: 12

  - platform: template
    name: "Fan Speed Down (Symphony probe)"
    on_press:
      - remote_transmitter.transmit_symphony:
          data: 0xD92
          nbits: 12

  # ── DIAGNOSTIC PROBES, added 2026-08-18 (ir-sniffer-blaster-54y) ─────────────
  # Retained deliberately while ir-sniffer-blaster-54y is open, at the owner's
  # request. They are additive: the production `Fan Power` button ABOVE is
  # untouched. Remove them with 54y.
  #
  # Purpose: determine whether this board's OWN RECEIVER can detect the carrier
  # at all, or whether it decodes by proximity overload / supply coupling. The
  # emitter and the 5990's receiver sit inches apart on one board sharing VIN,
  # so a decode at that range is NOT evidence that a real 38 kHz carrier is
  # leaving the LED. Every "the blaster's signal matches the remote" result on
  # 2026-08-18 rests on that receiver, so if it is carrier-blind those results
  # say nothing about the carrier.
  #
  # Both probes reuse the production button's array through the `&fan_raw`
  # YAML anchor, so they CANNOT drift from the signal they calibrate against.
  # Do not replace the alias with a literal copy -- the re-capture guidance
  # above actively invites that drift, and it would silently invalidate the
  # recorded result below while the comment still claimed sameness.
  # If all three carriers decode identically as Symphony 0xD81, the receiver is
  # NOT demodulating and the evidence is blind to carrier loss -- which is
  # consistent with a degraded emitter drive path (LED held on through each
  # mark instead of pulsed: brighter to a camera, invisible to the fan).
  #
  # *** RESULT, MEASURED 2026-08-18.
  # ***   TOTAL CARRIER LOSS IS RULED OUT. PARTIAL / WEAK CARRIER IS NOT. ***
  # Fired 3x per carrier, HTTP 200 on 9/9:
  #   38 kHz  -> 3/3 received, 3/3 decoded Symphony 0xD81
  #   0 Hz    -> 0/3. NO RECEIVER EVENT AT ALL in its window -- not a failed
  #              decode, nothing. So this receiver truly demodulates; it does
  #              NOT trigger on proximity overload or supply coupling.
  #   20 kHz  -> 3/3 received, 2/3 decoded
  # Consequence, stated no wider than the measurement reaches: a FULLY
  # unmodulated emitter -- the LED held DC-on through each mark -- is excluded.
  # That is ALL that is excluded. The 20 kHz row actively proves this receiver
  # CANNOT discriminate carrier: at ~2 in it decoded a carrier 18 kHz off
  # target 2/3 of the time. So a DEGRADED carrier -- a weak 38 kHz component
  # riding on a large DC pedestal -- would still decode here, still look bright
  # on a camera, and still starve the fan at distance.
  # *** THE DEGRADED-EMITTER-DRIVE HYPOTHESIS REMAINS LIVE. Do not read the
  # *** 0 Hz row as clearing the emitter; it does not.
  # Pinning exact carrier frequency or modulation depth needs a scope or a
  # photodiode, not this board.
  - platform: template
    name: "PROBE carrier 0Hz (no modulation)"
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 0
          code: *fan_raw

  - platform: template
    name: "PROBE carrier 20kHz (far out of band)"
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 20000
          code: *fan_raw
