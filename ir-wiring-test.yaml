# Minimal diagnostic: proves the 5990 IR RECEIVER is wired correctly.
#
# Deliberately has NO wifi / api / ota / web_server — so it needs no secrets.yaml,
# no network, no Home Assistant, and no Arduino toolchain. Everything reports over
# the USB serial console.
#
# Usage:
#   esphome run ir-wiring-test.yaml     # flash over USB, then it streams logs
#   (already flashed?)  esphome logs ir-wiring-test.yaml
#
# Then point any remote at the 5990 and press buttons.
#   - Decoded line and/or raw timing array  -> RX wiring is GOOD (green->GPIO14, power, GND all correct).
#   - Total silence                         -> see docs/wiring.md; check green->GPIO14, red->USB(5V), black->GND.
#   - Constant garbage with no button press -> floating/miswired data line.
#
# This is a throwaway test image. Flash ir-blaster-livingroom.yaml over it when done.

esphome:
  name: ir-wiring-test
  platformio_options:
    # CH34x USB-serial bridge is unreliable at the board definition's default 921600
    # upload speed ("chip stopped responding"). See docs/hardware.md.
    upload_speed: 115200

esp32:
  board: adafruit_feather_esp32_v2
  framework:
    type: arduino

logger:
  level: DEBUG          # raw/decoded IR dumps appear here

# IR RECEIVE (sniff) — green wire -> GPIO14
#
# NOTE: these receiver settings are duplicated from the authoritative firmware spec,
# ir-blaster-livingroom.yaml. If you change the RX pin or the tuning values THERE,
# mirror them here — otherwise this diagnostic silently tests a configuration the
# real firmware no longer uses, which defeats the point of a wiring test.
remote_receiver:
  pin:
    number: GPIO14
    inverted: false     # 5990 output is buffered/demodulated; do NOT invert
  dump: all             # log decoded protocol+code AND raw timings
  tolerance: 25%
  idle: 25ms
  buffer_size: 2kb

# IR TRANSMIT — white wire -> GPIO27.
# Declared purely so ESPHome drives this pin as an output (idle low), holding the
# emitter OFF. The 5990's emitter shares a board with its receiver: if GPIO27 were
# left as a floating input it could fire the LEDs and flood our own demodulator,
# faking the exact "constant garbage" symptom this test tells you to read as a
# receiver fault. We never actually transmit here.
remote_transmitter:
  pin: GPIO27
  carrier_duty_percent: 50%
